{% extends "base.html" %}

{% block title %} Upload | NeoGram {% endblock %}

{% block content %}

<style>
  /* ── Responsive Upload Card ── */
  .upload-wrapper {
    width: 100%;
    min-height: 100dvh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: clamp(1rem, 4vw, 3rem) clamp(0.75rem, 4vw, 1.5rem);
    box-sizing: border-box;
  }

  .upload-card {
    width: 100%;
    max-width: 480px;
    border-radius: 1.25rem;
    background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  /* Header */
  .upload-header {
    padding: clamp(0.75rem, 2.5vw, 1rem) clamp(1rem, 4vw, 1.5rem);
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
  }

  .upload-header h2 {
    font-size: clamp(1rem, 3.5vw, 1.125rem);
    font-weight: 600;
    color: #1f2937;
    margin: 0;
  }

  /* Form */
  .upload-form {
    padding: clamp(1rem, 4vw, 1.5rem);
    display: flex;
    flex-direction: column;
    gap: clamp(0.75rem, 3vw, 1rem);
  }

  /* File drop zone */
  .upload-dropzone {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: clamp(1.5rem, 6vw, 2.5rem) clamp(1rem, 4vw, 1.5rem);
    background: #f9fafb;
    border: 2px dashed #d1d5db;
    border-radius: 0.875rem;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    box-sizing: border-box;
    text-align: center;
  }

  .upload-dropzone:hover {
    background: #f3f4f6;
    border-color: #9ca3af;
  }

  .upload-dropzone span {
    color: #6b7280;
    font-size: clamp(0.78rem, 2.5vw, 0.875rem);
    line-height: 1.5;
  }

  /* Caption textarea */
  .upload-caption {
    width: 100%;
    padding: clamp(0.5rem, 2vw, 0.625rem) clamp(0.75rem, 2.5vw, 0.875rem);
    border-radius: 0.875rem;
    border: 1px solid #e5e7eb;
    color: #1f2937;
    font-size: clamp(0.85rem, 2.5vw, 0.9375rem);
    resize: vertical;
    min-height: 80px;
    box-sizing: border-box;
    font-family: inherit;
    transition: box-shadow 0.2s, border-color 0.2s;
    outline: none;
  }

  .upload-caption::placeholder {
    color: #9ca3af;
  }

  .upload-caption:focus {
    box-shadow: 0 0 0 2px #9ca3af;
    border-color: transparent;
  }

  /* Submit button */
  .upload-btn {
    width: 100%;
    padding: clamp(0.6rem, 2.5vw, 0.625rem);
    background: #111827;
    color: #fff;
    font-size: clamp(0.875rem, 2.5vw, 1rem);
    font-weight: 600;
    border: none;
    border-radius: 0.875rem;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }

  .upload-btn:hover {
    background: #374151;
  }

  /* ── Tiny phones (≤360px) ── */
  @media (max-width: 360px) {
    .upload-wrapper {
      padding: 0.5rem;
    }
    .upload-card {
      border-radius: 1rem;
    }
  }

  /* ── Full-bleed on very small phones ── */
  @media (max-width: 400px) {
    .upload-card {
      border-radius: 0.875rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
  }

  /* ── Tablet+ ── */
  @media (min-width: 640px) {
    .upload-wrapper {
      align-items: center;
    }
  }

  /* ── Laptop / desktop ── */
  @media (min-width: 1024px) {
    .upload-card {
      max-width: 520px;
    }
  }
</style>

<div class="upload-wrapper">
  <div class="upload-card">

    <!-- Header -->
    <div class="upload-header">
      <h2>Create a Post</h2>
    </div>

    <!-- Form — action/method/enctype unchanged -->
    <form
      action="{{ url_for('upload_post') }}"
      method="POST"
      enctype="multipart/form-data"
      class="upload-form"
    >

      <!-- File input -->
      <label class="upload-dropzone">
        <span>Click to upload or drag and drop</span>
        <input type="file" name="image" accept="image/*" class="hidden" required>
      </label>

      <!-- Caption -->
      <textarea
        name="caption"
        rows="3"
        class="upload-caption"
        placeholder="Write a caption..."
        required
      ></textarea>

      <!-- Submit -->
      <button type="submit" class="upload-btn">Post</button>

    </form>
  </div>
</div>

{% endblock %}
