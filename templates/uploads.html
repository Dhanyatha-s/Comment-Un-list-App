{% extends "base.html" %}

{% block title %} Upload | NeoGram {% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-12 rounded-2xl bg-white shadow-md overflow-hidden">

    <!-- Header -->
    <div class="px-6 py-3 border-b border-gray-200 text-center">
        <h2 class="text-lg font-semibold text-gray-800">Create a Post</h2>
    </div>

    <!-- Form -->
    <form action="{{ url_for('upload_post') }}" method="POST" enctype="multipart/form-data" class="px-6 py-4 space-y-4">

        <!-- File input -->
        <label class="w-full flex flex-col items-center px-4 py-6 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:bg-gray-100 hover:border-gray-400 transition">
            <span class="text-gray-500 text-sm">Click to upload or drag and drop</span>
            <input type="file" name="image" accept="image/*" class="hidden" required>
        </label>

        <!-- Caption input -->
        <textarea name="caption" rows="3"
            class="w-full px-3 py-2 rounded-xl border border-gray-200 
                   text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 transition"
            placeholder="Write a caption..." required></textarea>

        <!-- Submit button -->
        <button type="submit"
            class="w-full py-2 bg-gray-900 text-white font-semibold rounded-xl hover:bg-gray-700 transition">
            Post
        </button>
    </form>
</div>

{% endblock %}
